<link href="select.css" rel="stylesheet" />
<div class="select" data-select>
  <input class="select__input" type="text" readonly data-select__input />
  <button class="button button_size_s button_with-icon_only select__button"
          data-select__button
  >

      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
      class="button__icon"
    >

        d="M11.47 4.72a.75.75 0 0 1 1.06 0l3.75 3.75a.75.75 0 0 1-1.06 1.06L12 6.31 8.78 9.53a.75.75 0 0 1-1.06-1.06l3.75-3.75Zm-3.75 9.75a.75.75 0 0 1 1.06 0L12 17.69l3.22-3.22a.75.75 0 1 1 1.06 1.06l-3.75 3.75a.75.75 0 0 1-1.06 0l-3.75-3.75a.75.75 0 0 1 0-1.06Z"
        clip-rule="evenodd"
      />

    <span class="button__text">Открыть меню</span>

  <ul class="select__options" data-select__options>
    <li class="select__option" data-select__option>Select option</li>
    <li class="select__option" data-select__option>Option</li>
    <li class="select__option" data-select__option>Long select option</li>
  </ul>
</div>
<script src="select.js" defer></script>
